<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!--
      Active word: chromatic split + edge ring. The `-webkit-text-stroke`
      version cracked between glyph contours on some fonts; morphological
      dilation on `SourceAlpha` gives the same coverage without seams.

      Stack bottom to top:
        1. split-b — SourceAlpha offset by (-split-x, -split-y),
           tinted with split-color-b.
        2. split-a — SourceAlpha offset by (+split-x, +split-y),
           tinted with split-color-a.
        3. edge   — dilated SourceAlpha tinted with outline-color;
           narrow ring around the glyph that covers the inner edges of
           both ghosts, leaving the coloured fringes visible only past
           the ring.
        4. SourceGraphic — the white text, on top.
    -->
    <filter id="chroma-active" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="var(--tscaps-split-x, 0.045)em" dy="var(--tscaps-split-y, 0.03)em" result="split-a-shape"/>
      <feFlood flood-color="var(--tscaps-split-color-a, #ff2e63)" result="split-a-ink"/>
      <feComposite in="split-a-ink" in2="split-a-shape" operator="in" result="split-a"/>
      <feOffset in="SourceAlpha" dx="-var(--tscaps-split-x, 0.045)em" dy="-var(--tscaps-split-y, 0.03)em" result="split-b-shape"/>
      <feFlood flood-color="var(--tscaps-split-color-b, #1fffd0)" result="split-b-ink"/>
      <feComposite in="split-b-ink" in2="split-b-shape" operator="in" result="split-b"/>

      <feMorphology in="SourceAlpha" operator="dilate"
                    radius="var(--tscaps-outline-thickness, 0.025)em" result="edge-shape"/>
      <feFlood flood-color="var(--tscaps-outline-color, #000000)" result="edge-ink"/>
      <feComposite in="edge-ink" in2="edge-shape" operator="in" result="edge"/>

      <feMerge>
        <feMergeNode in="split-b"/>
        <feMergeNode in="split-a"/>
        <feMergeNode in="edge"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
